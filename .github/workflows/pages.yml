name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install the app
        working-directory: apps/mobile
        run: npm ci
      - name: Bundle the in-browser catalogue and notes
        working-directory: apps/mobile
        run: node scripts/bundle-demo-data.mjs
      - name: Check the in-browser demo
        working-directory: apps/mobile
        run: npx --yes tsx scripts/demo-selftest.ts
      - name: Export the static demo
        working-directory: apps/mobile
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_DEMO: "1"
          EXPO_PUBLIC_BASE_PATH: /Spares-Vault
        run: npx expo export --platform web --output-dir dist
      - name: Make GitHub Pages serve the app
        run: |
          cp apps/mobile/dist/index.html apps/mobile/dist/404.html
          touch apps/mobile/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
